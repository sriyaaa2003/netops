apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-service
  namespace: netops
  labels:
    app: anomaly-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-service
  template:
    metadata:
      labels:
        app: anomaly-service
    spec:
      containers:
        - name: anomaly-service
          image: sriya13/anomaly-service:1.0
          # IfNotPresent only checks whether this tag exists locally, not
          # whether it's current, so a rebuilt image under the same tag
          # would never get pulled without this.
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: LOG_SERVICE_URL
              value: http://log-service:4000
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
